# Explicit project name: Compose otherwise derives it from the directory basename,
# and every repo with a packages/api would merge into the same project.
name: modulo-integrador

services:
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - rustfs-data:/data

  postgres:
    image: postgres:18-alpine
    ports:
      - "5450:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rustfs-data:
