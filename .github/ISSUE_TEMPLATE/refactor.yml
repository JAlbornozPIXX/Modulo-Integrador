name: Refactor / tech debt
description: Propose an internal change that improves the code without changing behavior
title: "Refactor: "
labels: ["refactor", "tech-debt"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for changes that keep external behavior the same while improving the code —
        restructuring, removing dead code, extracting a shared helper, tightening types. For a
        new capability use *Feature request*; for something broken use *Bug report*. Read
        `.agents/conventions.md` first so the proposal aligns with existing patterns.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0-critical
        - P1-high
        - P2-medium
        - P3-low
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current state
      description: What does the code look like today, and where? Name files / modules.
      placeholder: |
        Every controller reads `req.principal!.userId` and calls `parseId(req.params.x)` by hand,
        repeated across ~8 controllers.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Why it needs changing
      description: The pain — duplication, fragility, a convention drift, a footgun. Not "it's ugly", but what it costs.
      placeholder: |
        Verbose and error-prone; `Number(req.params.x)` yields NaN on a missing/placeholder id,
        which reaches SQLite as a bare token and 500s instead of returning 400.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The target shape. Reference existing patterns/helpers to reuse rather than new abstractions where possible.
      placeholder: |
        Parameter decorators (@CurrentUser, @Body, @NumericParam) resolved by BaseController,
        so handlers declare their inputs and never touch req.
    validations:
      required: true

  - type: dropdown
    id: behavior
    attributes:
      label: Behavior change
      description: A refactor should be behavior-preserving. If it isn't fully, say so.
      options:
        - "None — pure refactor, identical observable behavior"
        - "Internal only — API/responses unchanged, internals differ"
        - "Minor — small intentional behavior change (describe below)"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope / blast radius
      description: Which files or modules are touched? Is it mechanical-and-wide or deep-and-narrow?
      placeholder: |
        In scope: all controllers + BaseController + new shared/ helpers.
        Out of scope: services, models, routes/URLs.
    validations:
      required: false

  - type: textarea
    id: risk
    attributes:
      label: Regression risk & verification
      description: What could break, and how will you prove it didn't? (typecheck, tests, end-to-end run).
      placeholder: |
        Risk: a handler wired to the wrong resolver. Verify: npm run typecheck + exercise every
        migrated endpoint end-to-end; confirm zero 5xx.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Definition of done
      options:
        - label: "Behavior preserved (or the intentional change is called out above)"
        - label: "Dead code / now-unused exports removed as part of the change"
        - label: "`.agents/` docs updated if a pattern or convention changed"
        - label: "`npm run typecheck` clean and affected paths verified end-to-end"
